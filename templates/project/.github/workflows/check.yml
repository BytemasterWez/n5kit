name: check
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Require pinned library
        env:
          REF: ${{ vars.N5KIT_REVISION }}
        run: '[[ "$REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ vars.N5KIT_REPOSITORY }}
          ref: ${{ vars.N5KIT_REVISION }}
          path: .n5kit
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install ruff==0.16.6
      - run: make check N5KIT="$GITHUB_WORKSPACE/.n5kit"
